name: CD / API
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cd-api.yml
      - modules/api
      - modules/common
      - hack/docker
      - hack/gateway
    tags:
      - "v*.*.*"
permissions:
  contents: write
  id-token: write
  packages: write
env:
  TERM: xterm
jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/lbenicio/kubernetes-dashboard-api
            docker.io/lbenicio/kubernetes-dashboard-api
          tags: |
            type=raw,value=latest
            type=match,pattern=\d+\.\d+\.\d+
            type=sha
      - uses: docker/setup-qemu-action@v4.4.0
      - uses: docker/setup-buildx-action@v4.4.1
        with:
          config: .github/buildkitd.toml
      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PAT }}
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/build-push-action@v7
        with:
          context: modules
          file: modules/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64,linux/arm,linux/ppc64le,linux/s390x
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version || 'latest' }}
      - if: steps.push.outcome == 'success' && startsWith(github.ref, 'refs/tags/api/v')
        uses: ncipollo/release-action@v1
        with:
          allowUpdates: true
          makeLatest: false
          body: |
            ### Images

            ```
            docker.io/lbenicio/kubernetes-dashboard-api:${{ steps.meta.outputs.version }}
            ghcr.io/lbenicio/kubernetes-dashboard-api:${{ steps.meta.outputs.version }}
            ```
