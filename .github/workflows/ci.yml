name: CI
on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "0 0 * * 1"
permissions:
  contents: read
env:
  GOPATH: /home/runner/go/
  GOPROXY: "https://proxy.golang.org"
  NG_CLI_ANALYTICS: ci
  NODE_OPTIONS: "--max-old-space-size=8192"
  TERM: xterm
jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: critical

  codeql-analysis:
    name: CodeQL analysis
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["go", "typescript"]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: modules/api/go.mod
          check-latest: true
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v4
      - uses: github/codeql-action/analyze@v4

  static-check:
    name: Static check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: modules/api/go.mod
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Install Corepack for pinned Yarn
        run: |
          npm install --global corepack@0.36.0
          corepack enable
      - working-directory: modules/web
        run: yarn
      - run: PATH=$PATH:$GOPATH/bin make check

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: modules/api/go.mod
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Install Corepack for pinned Yarn
        run: |
          npm install --global corepack@0.36.0
          corepack enable
      - working-directory: modules/web
        run: yarn
      - run: PATH=$PATH:$GOPATH/bin make build

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - run: make image

  publish:
    name: Build and push API container
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]' # not a fork and not dependabot
    runs-on: ubuntu-latest
    env:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PAT: ${{ secrets.DOCKER_PAT }}
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Docket meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/lbenicio/kubernetes-dashboard-api
            docker.io/lbenicio/kubernetes-dashboard-api
          tags: |
            type=sha
            type=ref,event=pr
            type=ref,event=branch
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          config: .github/buildkitd.toml
      - name: Login to Docker Hub
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ env.DOCKER_USER }}
          password: ${{ env.DOCKER_PAT }}
      - name: Login to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: modules
          file: modules/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ steps.meta.outputs.version || 'latest' }}

  unit-tests:
    name: Unit tests with coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: modules/go.work
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Install Corepack for pinned Yarn
        run: |
          npm install --global corepack@0.36.0
          corepack enable
      - working-directory: modules/web
        run: yarn
      - run: PATH=$PATH:$GOPATH/bin make coverage
      - uses: codecov/codecov-action@v7.1.1
        with:
          directory: ./.tmp
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e-tests:
    name: End-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: helm/kind-action@v1.15.1
        with:
          version: v0.33.0
          kubectl_version: v1.37.1
          cluster_name: kubernetes-dashboard-v137
          config: hack/include/kind.config.yml
          node_image: docker.io/kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: modules/go.work
          check-latest: true
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
      - name: Install Corepack for pinned Yarn
        run: |
          npm install --global corepack@0.36.0
          corepack enable
      - working-directory: modules/web
        run: yarn install --immutable
      - name: Create isolated cluster credentials for Cypress
        run: |
          mkdir -p .tmp
          kind get kubeconfig --name kubernetes-dashboard-v137 > .tmp/kubeconfig-host
          KUBECONFIG=.tmp/kubeconfig-host kubectl --context kind-kubernetes-dashboard-v137 create serviceaccount dashboard-e2e --namespace default
          KUBECONFIG=.tmp/kubeconfig-host kubectl --context kind-kubernetes-dashboard-v137 create clusterrole dashboard-e2e-namespace-reader --verb=get,list,watch --resource=namespaces
          KUBECONFIG=.tmp/kubeconfig-host kubectl --context kind-kubernetes-dashboard-v137 create clusterrolebinding dashboard-e2e-namespace-reader --clusterrole=dashboard-e2e-namespace-reader --serviceaccount=default:dashboard-e2e
          token="$(KUBECONFIG=.tmp/kubeconfig-host kubectl --context kind-kubernetes-dashboard-v137 create token dashboard-e2e --namespace default --duration=1h)"
          echo "::add-mask::$token"
          echo "CYPRESS_token=$token" >> "$GITHUB_ENV"
      - run: PATH=$PATH:$GOPATH/bin yarn e2e
        working-directory: modules/web
