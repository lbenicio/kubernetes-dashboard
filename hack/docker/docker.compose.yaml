services:
  gateway:
    container_name: kong-gateway
    image: kong/kong-gateway:3.14
    environment:
      - "KONG_DATABASE=off"
      - "KONG_PROXY_ACCESS_LOG=/dev/stdout"
      - "KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yml"
      - "KONG_ADMIN_ACCESS_LOG=/dev/stdout"
      - "KONG_PROXY_ERROR_LOG=/dev/stderr"
      - "KONG_ADMIN_ERROR_LOG=/dev/stderr"
      - "KONG_DNS_ORDER=LAST,A,CNAME"
    volumes:
      - ${PWD}/hack/gateway/prod.kong.yml:/kong/declarative/kong.yml
    ports:
      - "8080:8000"
      - "8443:8443"

  auth:
    container_name: dashboard-auth
    build:
      context: ../../modules
      dockerfile: auth/Dockerfile
      args:
        VERSION: ${VERSION:?}
    command:
      - "--kubeconfig=${KUBECONFIG:?}"
    environment:
      DASHBOARD_SESSION_KEY: ${DASHBOARD_SESSION_KEY:-}
      DASHBOARD_SESSION_COOKIE_SECURE: ${DASHBOARD_SESSION_COOKIE_SECURE:-true}
      DASHBOARD_ANONYMOUS_ADMIN: ${DASHBOARD_ANONYMOUS_ADMIN:-false}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile email}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_PICTURE_CLAIM: ${OIDC_PICTURE_CLAIM:-picture}
    volumes:
      - ${KUBECONFIG:?}:${KUBECONFIG:?} # Required - tmp kubeconfig path resolves to $DASHBOARD_DIR/.tmp/kubeconfig
    tmpfs:
      - /tmp

  api:
    container_name: dashboard-api
    build:
      context: ../../modules
      dockerfile: api/Dockerfile
      args:
        VERSION: ${VERSION:?}
    command:
      --kubeconfig=${KUBECONFIG:?}
      --sidecar-host=${SIDECAR_HOST:?}
    environment:
      DASHBOARD_SESSION_KEY: ${DASHBOARD_SESSION_KEY:-}
      DASHBOARD_ANONYMOUS_ADMIN: ${DASHBOARD_ANONYMOUS_ADMIN:-false}
    volumes:
      - ${KUBECONFIG:?}:${KUBECONFIG:?} # Required - tmp kubeconfig path resolves to $DASHBOARD_DIR/.tmp/kubeconfig
    tmpfs:
      - /tmp

  web:
    container_name: dashboard-web
    build:
      context: ../..
      dockerfile: modules/web/Dockerfile
      args:
        VERSION: ${VERSION:?}
        WEB_BUILDER_ARCH: ${WEB_BUILDER_ARCH:?}
    command:
      - "--kubeconfig=${KUBECONFIG:?}"
      - "--system-banner=${SYSTEM_BANNER:?}"
      - "--system-banner-severity=${SYSTEM_BANNER_SEVERITY:?}"
    volumes:
      - ${KUBECONFIG:?}:${KUBECONFIG:?} # Required - tmp kubeconfig path resolves to $DASHBOARD_DIR/.tmp/kubeconfig
    tmpfs:
      - /tmp

  scraper:
    container_name: metrics-scraper
    build:
      context: ../../modules
      dockerfile: metrics-scraper/Dockerfile
      args:
        VERSION: ${VERSION:?}
    command:
      --kubeconfig=${KUBECONFIG:?}
      --metric-resolution=5s
      --metric-duration=10m
    volumes:
      - ${KUBECONFIG:?}:${KUBECONFIG:?} # Required - tmp kubeconfig path resolves to $DASHBOARD_DIR/.tmp/kubeconfig
    shm_size: 1G
    tmpfs:
      - /tmp

networks:
  default:
    name: kind
    external: true
