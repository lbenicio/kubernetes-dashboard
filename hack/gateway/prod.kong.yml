_format_version: "3.0"

services:
  - name: auth
    host: auth # Internal name of docker service
    port: 8000
    protocol: http
    routes:
      - name: authLogin
        paths:
          - /api/v1/login
        protocols:
          - http
          - https
        strip_path: false
      - name: authCsrf
        paths:
          - /api/v1/csrftoken/login
          - /api/v1/csrftoken/logout
          - /api/v1/csrftoken/oidc
        protocols:
          - http
          - https
        strip_path: false
      - name: authMe
        paths:
          - /api/v1/me
        protocols:
          - http
          - https
        strip_path: false
      - name: authLoginConfig
        paths:
          - /api/v1/login/config
        protocols:
          - http
          - https
        strip_path: false
      - name: authLogout
        paths:
          - /api/v1/logout
        protocols:
          - http
          - https
        strip_path: false
      - name: authOIDC
        paths:
          - /api/v1/oidc
        protocols:
          - http
          - https
        strip_path: false
  - name: api
    host: api # Internal name of docker service
    port: 8000
    protocol: http
    routes:
      - name: api
        paths:
          - /api
        protocols:
          - http
          - https
        strip_path: false
      - name: metrics
        paths:
          - /metrics
        protocols:
          - http
          - https
        strip_path: false
  - name: web
    host: web # Internal name of docker service
    port: 8000
    protocol: http
    routes:
      - name: root
        paths:
          - /
        protocols:
          - http
          - https
        strip_path: false
