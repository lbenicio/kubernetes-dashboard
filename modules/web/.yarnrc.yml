nodeLinker: node-modules

enableScripts: false

# The dev container shares this workspace with the macOS host. Install native
# optional dependencies for both environments so one Yarn install works in each.
supportedArchitectures:
  cpu:
    - arm64
    - x64
  libc:
    - glibc
    - musl
  os:
    - darwin
    - linux

yarnPath: .yarn/releases/yarn-4.18.1.cjs
