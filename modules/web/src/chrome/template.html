<div class="kd-chrome-root">
  <mat-toolbar class="kd-toolbar kd-primary-toolbar">
    <div class="kd-toolbar-tools kd-primary-toolbar-tools">
      <div class="kd-logo-bar">
        <a
          [routerLink]="getWorkloadsStateName()"
          queryParamsHandling="preserve"
          class="kd-toolbar-logo-link"
        >
          <mat-icon
            [svgIcon]="assets.getAppLogo()"
            class="kd-toolbar-logo"
          >
          </mat-icon>
          <mat-icon
            [svgIcon]="assets.getAppLogoText()"
            class="kd-toolbar-logo-text"
          >
          </mat-icon>
        </a>
      </div>
      <kd-namespace-selector id="nav-namespace-selector"> </kd-namespace-selector>

      <kd-search class="kd-toolbar-search"> </kd-search>
      <div class="kd-toolbar-actions">
        <button
          mat-icon-button
          color="primary"
          class="kd-toolbar-action"
          i18n-matTooltip
          matTooltip="Create new resource"
          (click)="goToCreateState()"
        >
          <mat-icon class="kd-primary-toolbar-icon">add</mat-icon>
        </button>
        <kd-notifications class="kd-toolbar-action"></kd-notifications>
        <kd-user-panel class="kd-toolbar-action"></kd-user-panel>
      </div>
    </div>
  </mat-toolbar>

  <mat-toolbar class="kd-second-toolbar kd-bg-primary">
    <div
      class="kd-toolbar-tools kd-secondary-toolbar-tools"
    >
      <kd-nav-hamburger class="kd-secondary-toolbar-hamburger"></kd-nav-hamburger>
      <kd-breadcrumbs class="kd-actionbar-breadcrumbs"></kd-breadcrumbs>
      <kd-actionbar class="kd-secondary-toolbar-actionbar"></kd-actionbar>
    </div>
  </mat-toolbar>

  @if (isSystemBannerVisible()) {
  <mat-toolbar
    class="kd-system-banner"
    [ngClass]="getSystemBannerClass()"
    [innerHTML]="getSystemBannerMessage()"
  >
  </mat-toolbar>
  }

  <div class="kd-chrome-container kd-bg-background">
    <kd-nav></kd-nav>
    <div class="kd-scroll-container kd-main-scroll-container">
      @switch (loading) { @case (true) {
      <div class="kd-loading-indicator">
        <mat-spinner
          mode="indeterminate"
          [diameter]="48"
        >
        </mat-spinner>
      </div>
      } @case (false) {
      <div class="kd-scroll-container kd-page-scroll-container">
        <router-outlet></router-outlet>
        <kd-footer></kd-footer>
      </div>
      } }
    </div>
  </div>
</div>
