<mat-card
  appearance="outlined"
  [ngClass]="{
    'kd-minimized-card': !expanded && !graphMode,
    'kd-graph': graphMode,
    'kd-inner-table': role === 'inner',
    'kd-inner-content': role === 'inner-content',
    'kd-flex': role === 'flex',
  }"
>
  @if (withTitle) {
  <mat-card-title
    [ngClass]="getTitleClasses()"
    (click)="onCardHeaderClick(); $event.stopPropagation()"
    class="kd-layout-align-start-center"
  >
    <div class="kd-card-title kd-layout-flex-100">
      <ng-content select="[title]"></ng-content>
    </div>
    @if (!expanded) {
    <div class="kd-card-description kd-muted kd-layout-align-start-center kd-layout-flex-80">
      <ng-content select="[description]"></ng-content>
    </div>
    } @if (expanded && expandable) {
    <div class="kd-card-actions kd-muted">
      <ng-content select="[actions]"></ng-content>
    </div>
    } @if (expandable) {
    <button
      class="kd-card-toggle"
      mat-icon-button
      (click)="expand(); $event.stopPropagation()"
    >
      <mat-icon
        class="kd-muted"
        [matTooltip]="expanded ? message.Minimize : message.Expand"
      >
        @if (expanded) { arrow_drop_up } @if (!expanded) { arrow_drop_down }
      </mat-icon>
    </button>
    }
  </mat-card-title>
  }

  <div
    [@expandInOut]="!expanded"
    [ngClass]="{'kd-inner-content': role === 'inner-content'}"
  >
    <mat-card-content
      class="kd-card-content"
      [ngClass]="{'kd-card-content-table': role === 'table'}"
    >
      @if (initialized) {
      <div>
        <ng-content select="[content]"></ng-content>
      </div>
      } @else {
      <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
      }
    </mat-card-content>

    <mat-card-footer>
      <div
        class="mat-small"
        [ngClass]="{'kd-card-footer': withFooter}"
      >
        <ng-content select="[footer]"></ng-content>
      </div>
    </mat-card-footer>
  </div>
</mat-card>
