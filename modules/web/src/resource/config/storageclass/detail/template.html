<kd-object-meta
  [initialized]="isInitialized"
  [objectMeta]="$safeNavigationMigration(storageClass?.objectMeta)"
></kd-object-meta>

<kd-card [initialized]="isInitialized">
  <div
    title
    i18n
  >
    Resource information
  </div>
  @if (isInitialized) {
  <div
    content
    class="kd-layout-row-wrap"
  >
    @if (storageClass?.provisioner) {
    <kd-property class="kd-layout-flex-100">
      <div
        key
        i18n
      >
        Provisioner
      </div>
      <div value>{{ storageClass?.provisioner }}</div>
    </kd-property>
    } @for (parameter of getParameterNames(); track parameter) {
    <kd-property>
      <div
        key
        class="kd-layout-row"
      >
        {{ parameter }}
        <mat-icon
          i18n-matTooltip
          matTooltip="Parameter"
          class="kd-storage-class-parameter-icon"
          >tune</mat-icon
        >
      </div>
      <div value>{{ storageClass?.parameters[parameter] }}</div>
    </kd-property>
    }
  </div>
  }
</kd-card>

<kd-persistent-volume-list [endpoint]="pvListEndpoint"></kd-persistent-volume-list>
